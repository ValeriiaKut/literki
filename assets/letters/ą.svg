<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480">
  <!--
    Coordinate system (shared across all letter SVGs):
      cap-height top:    y =  40
      x-height top:      y = 160
      baseline:          y = 320
      descender bottom:  y = 460
    Strokes are listed in pedagogical drawing order.
    stroke-1: lowercase 'a' body (oval loop + right tail down to baseline).
    stroke-2: ogonek hook, descending below the baseline inside the viewBox
              so no manual offset is needed at render time.
  -->
  <g id="strokes" fill="none" stroke="#000" stroke-width="56" stroke-linecap="round" stroke-linejoin="round">
    <path id="stroke-1" d="M 270 200 C 270 145 130 145 130 240 C 130 320 270 320 270 240 L 270 320"/>
    <path id="stroke-2" d="M 270 320 C 285 360 315 395 340 435"/>
  </g>
</svg>

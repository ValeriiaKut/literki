name: untitled
description: "Literki - nauka pisania polskich liter dla dzieci. Aplikacja mobilna, która pomaga dzieciom w nauce pisania polskich liter poprzez interaktywne ćwiczenia i gry edukacyjne."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.4
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  image_path: "assets/literki-icon-1024.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#F6F1E4"
  adaptive_icon_foreground: "assets/literki-icon-1024.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#F6F1E4"
  android: true
  ios: false

flutter:


  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/letters_svg/
    - assets/letters_svg/plain/
    - assets/letters_svg/ruled/
    - assets/literki_dzwieki/

  fonts:
    - family: Handwriting
      fonts:
        - asset: assets/fonts/PlaywritePL-VariableFont_wght.ttf
    - family: Elementarz
      fonts:
        - asset: assets/fonts/Elementarz2.ttf

